name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior in GoLogs
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report an issue in GoLogs!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Ingest case file '...'
        2. Execute prompt '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, Node.js version, and Ollama model used.
      placeholder: |
        - OS: Windows 11 / WSL2 / Linux
        - Python: 3.12
        - Ollama Model: llama3.1:8b-instruct-q4_K_M
    validations:
      required: false
