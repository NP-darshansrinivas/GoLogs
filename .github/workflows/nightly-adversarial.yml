name: Nightly Adversarial Suite

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # allow manual trigger from the Actions UI

defaults:
  run:
    working-directory: backend

jobs:
  injection-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run the 40-fixture adversarial injection corpus
        run: pytest tests/security/injection_harness -v
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly adversarial suite failed on ${new Date().toISOString().slice(0, 10)}`,
              body: "The injection_harness recall rate dropped below the PRD §24 / Business Goal §3 threshold (>=95%), or the structural compromised-model test failed. See the workflow run for details.",
              labels: ["security", "regression"],
            });
